<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Bingo</a>
            <button id="theme-toggle" class="btn btn-outline-danger">Toggle Theme</button>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <div id="bingo-board" class="row g-2"></div>
            </div>
            <div class="col-md-4">
                <button id="draw-btn" class="btn btn-danger w-100 mb-3">Draw Number</button>
                <div class="card">
                    <div class="card-body">
                        <h5>Last Called: <span id="last-number">-</span></h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
